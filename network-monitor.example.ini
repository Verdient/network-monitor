# 服务长期设置，使用 -c 指定；install 会按系统和架构选择默认保存位置。
# 支持的设置遵循：命令行 > 配置文件 > 内置默认值。
# count、start/end、图表与安装选项只能通过命令行指定。
# 普通命令的相对路径以当前工作目录为准。
# install 会将 database 相对路径放到服务数据目录，并保存生效后的配置。

[monitor]
# 多网卡用逗号分隔；省略时只采集默认路由网卡
# interface = eth0, wlan0
database = network-monitor.db
interval = 1

[stats]
# 默认系统时区；也支持 UTC、+08:00
# timezone = Asia/Shanghai
