name: Linux deb 安装包

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - network-monitor.spec
      - geo_data/**
      - requirements-build.txt
      - packaging/debian/**
      - scripts/test_deb_container.sh
      - scripts/debian11_sources.sh
      - .github/workflows/deb.yml
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: amd64
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 在 Debian 11 基线环境构建独立可执行文件和安装包
        run: |
          python3 scripts/ci_run.py docker run --rm -v "$PWD:/work" -w /work python:3.12-bullseye sh -ec '
            sh scripts/debian11_sources.sh
            apt-get update -qq
            apt-get install -y --no-install-recommends binutils iproute2 systemd
            python -m pip install -r requirements-build.txt
            python scripts/test.py
            python -m PyInstaller --clean --noconfirm network-monitor.spec
            NETWORK_MONITOR_BINARY=/work/dist/network-monitor/network-monitor python scripts/test.py
            python scripts/release.py deb
          '
          sudo chown -R "$(id -u):$(id -g)" build dist release
      - name: 在无 Python 的 Debian 11 中验证安装和采集
        run: python3 scripts/ci_run.py docker run --rm -v "$PWD:/work:ro" -w /tmp debian:bullseye sh /work/scripts/test_deb_container.sh
      - name: 下载使用单文件打包的旧版安装包
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_TAG: v0.2.1
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          OLD_PACKAGE="network-monitor_${OLD_TAG#v}-1_${PACKAGE_ARCH}.deb"
          gh release download "$OLD_TAG" --repo Verdient/network-monitor --dir "$RUNNER_TEMP/previous-deb" \
            --pattern "$OLD_PACKAGE" --pattern SHA256SUMS
          cd "$RUNNER_TEMP/previous-deb"
          awk -v package="$OLD_PACKAGE" '$2 == package' SHA256SUMS | sha256sum --check
      - name: 验证 systemd 服务以及从旧版升级和卸载
        run: python3 scripts/ci_run.py sudo --preserve-env=GITHUB_ACTIONS python3 scripts/test_deb.py release/*.deb "$RUNNER_TEMP"/previous-deb/*.deb
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.architecture }}
          path: release/*.deb
          if-no-files-found: error
