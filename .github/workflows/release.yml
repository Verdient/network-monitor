name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate tag and runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python - <<'PY'
          import os
          import platform
          from version import __version__
          assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag must match version.py'
          assert platform.machine() == os.environ['EXPECTED_ARCHITECTURE'], 'Unexpected runner architecture'
          PY
      - name: Run source tests
        run: python scripts/test.py
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm network-monitor.spec
      - name: Test standalone executable
        env:
          NETWORK_MONITOR_BINARY: dist/network-monitor
        run: python scripts/test.py
      - name: Create release archive
        run: python scripts/release.py archive
      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.architecture }}
          path: release/*.tar.gz
          if-no-files-found: error

  brew-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Generate a local formula from tested archives
        run: |
          python scripts/release.py formula --assets assets --output formula
          python - <<'PY'
          from pathlib import Path
          from version import __version__
          path = Path('formula/network-monitor.rb')
          formula = path.read_text()
          for archive in Path('assets').glob('*.tar.gz'):
              url = f'https://github.com/Verdient/network-monitor/releases/download/v{__version__}/{archive.name}'
              formula = formula.replace(url, archive.resolve().as_uri())
          path.write_text(formula)
          PY
      - name: Install and test through Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap-new local/network-monitor
          cp formula/network-monitor.rb "$(brew --repository local/network-monitor)/Formula/network-monitor.rb"
          brew install local/network-monitor/network-monitor
          brew test local/network-monitor/network-monitor
          network-monitor --version
          network-monitor stats --help

  draft-release:
    needs: [build, brew-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Generate public formula and checksums
        run: python scripts/release.py formula --assets assets --output formula
      - name: 生成中文发布说明
        run: python scripts/release.py notes
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          notes = Path('release-notes.md')
          existing = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft'],
                                    capture_output=True, text=True)
          if existing.returncode == 0:
              import json
              if not json.loads(existing.stdout)['isDraft']:
                  raise SystemExit('Refusing to replace an already published release')
              subprocess.run(['gh', 'release', 'edit', tag, '--notes-file', str(notes)], check=True)
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--draft', '--verify-tag',
                              '--title', tag, '--notes-file', str(notes)], check=True)
          files = sorted(Path('assets').glob('*.tar.gz')) + [Path('formula/SHA256SUMS'), Path('formula/network-monitor.rb')]
          subprocess.run(['gh', 'release', 'upload', tag, '--clobber', *map(str, files)], check=True)
          PY
